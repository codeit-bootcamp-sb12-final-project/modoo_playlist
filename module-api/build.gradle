plugins {
    id 'org.springframework.boot'
    id 'jacoco'
}

description = 'module-api'

dependencies {
    implementation project(':core')
    implementation project(':infra')

    // Web
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    implementation 'org.springframework.security:spring-security-messaging'

    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'

    // Data
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.5'
    implementation platform('software.amazon.awssdk:bom:2.54.3')
    implementation 'software.amazon.awssdk:s3'

    // Kafka
    implementation 'org.springframework.boot:spring-boot-starter-kafka'

    // AI
//    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // 현재 코드가 Jackson 2 패키지를 직접 import함
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // JWT
    implementation 'com.nimbusds:nimbus-jose-jwt'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'com.microsoft.playwright:playwright:1.55.0'
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'e2e' }
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        html.required = true
        xml.required = false
    }
}

tasks.register('e2eTest', Test) {
    description = 'Runs browser authentication tests (Docker and a Playwright browser required).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'e2e' }
    systemProperty 'e2e.browser.channel', System.getProperty('e2e.browser.channel', 'chromium')
    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'
}

tasks.register('installE2eBrowser', JavaExec) {
    description = 'Installs Chromium for browser tests.'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', 'chromium'
}