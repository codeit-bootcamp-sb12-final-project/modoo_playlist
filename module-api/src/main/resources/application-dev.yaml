spring:
  config:
    activate:
      on-profile: dev

module-api:
  jwt:
    access-token:
      secret: ${JWT_ACCESS_SECRET:local-development-access-secret-at-least-32-bytes}
    refresh-token:
      secret: ${JWT_REFRESH_SECRET:local-development-refresh-secret-at-least-32-bytes}
  auth:
    cookie:
      secure: false