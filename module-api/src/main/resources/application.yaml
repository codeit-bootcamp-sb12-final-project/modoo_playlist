spring:
  application:
    name: module-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:oauth-disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:oauth-disabled}
            scope:
              - openid
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:oauth-disabled}
            client-secret: ${KAKAO_CLIENT_SECRET:oauth-disabled}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            # redirect-uri는 기본으로 제공해 주지 않나?
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao
        provider:
          kakao:
            issuer-uri: https://kauth.kakao.com
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:6MB}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:local}
    password: ${SMTP_PASSWORD:local}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.7-flash
          thinking-level: LOW
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: gemini-embedding-2
  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}
    connection-timeout: ${ELASTICSEARCH_CONNECTION_TIMEOUT:2s}
    socket-timeout: ${ELASTICSEARCH_SOCKET_TIMEOUT:30s}
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

module-api:
  admin: # dev에서 실패 방지를 위해 false로 명시
    enabled: ${ADMIN_ENABLED:false}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:admin}
  bot:
    enabled: ${BOT_ENABLED:true}
    email: ${BOT_EMAIL:bot@modoo.bot}
    name: ${BOT_NAME:MoDoo Bot}
  auth:
    oauth2:
      success-redirect-uri: ${OAUTH_SUCCESS_REDIRECT_URI:/#/contents}
      failure-redirect-uri: ${OAUTH_FAILURE_REDIRECT_URI:/#/sign-in}
    cookie:
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax} # 다른 사이트에서 보내느 요청에 refresh 토큰 전달 방지
      path: ${AUTH_COOKIE_PATH:/api/auth}
    temporary-password:
      length: ${TEMPORARY_PASSWORD_LENGTH:8}
      expiration: ${TEMPORARY_PASSWORD_EXPIRATION:3m}
  mail:
    from: ${MAIL_FROM:no-reply@modoo.playlist}
  jwt:
    access-token:
      expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000} # 30 minutes
    refresh-token:
      expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
      max-expiration-ms: ${JWT_MAX_REFRESH_EXPIRATION_MS:2592000000} # 30 days
    issuer: modoo-playlist

external:
  tmdb:
    access-token: ${TMDB_ACCESS_TOKEN:업서여}
  sports-db:
    api-key: ${THESPORTSDB_API_KEY}
