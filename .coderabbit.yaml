# ================================================================ #
#                       CodeRabbit 설정 파일                        #
#                                                                  #
#  기본값과 동일한 설정은 적지 않습니다.                              #
#  여기 있는 항목 = 모두 CodeRabbit 기본 동작을 바꾸는 설정입니다.     #
#  전체 옵션/기본값: https://docs.coderabbit.ai/reference/configuration
# ================================================================ #

# 리뷰 언어 설정 - 한국어로 피드백을 받습니다 (기본: en-US)
language: "ko-KR"

# 리뷰어 톤 설정 (최대 250자 제한, 현재 237자)
tone_instructions: >
  1. 단순히 문제를 지적하는 것에 그치지 않고, 왜 문제인지 원인까지 설명해주세요.
  2. 지적마다 심각도를 표시해주세요: 🔴 반드시 수정 / 🟡 권장 / 🟢 취향(선택).
  3. 중요한(🔴, 🟡) 지적에는 관련 레퍼런스나 공식 문서를 함께 제안해주세요.
     🟢 수준의 사소한 지적에는 굳이 붙이지 않아도 됩니다.
  4. 잘된 부분은 가볍고 유쾌하게 칭찬해주세요.
  5. 전반적으로 함께 성장하는 동료 개발자처럼 피드백해주세요.

# ================================================================ #
#                        리뷰 상세 설정                              #
# ================================================================ #
reviews:
  # 리뷰 강도 설정
  # - quiet:     코멘트를 최소화하고 요약 위주로만 리뷰
  # - chill:     버그/보안 위주로 부드럽게. 팀이 CodeRabbit에 익숙하지 않거나
  #              린트/포맷터가 이미 갖춰진 경우 추천 (현재 사용 중)
  # - assertive: chill + 코드 스타일, 네이밍, 문서화 누락, 테스트 커버리지,
  #              베스트 프랙티스까지 꼼꼼하게 지적.
  #              팀이 피드백에 익숙해진 뒤(보통 2~4주 후) 전환 권장
  profile: "chill"

  # 레이블 자동 제안 (수동으로 관리)
  suggested_labels: false

  # 리뷰어 추천 (수동으로 지정)
  suggested_reviewers: false

  # 리뷰 진행 중 표시되는 운세 메시지 비활성화
  in_progress_fortune: false

  # -------------------------------------------------------------- #
  #                리뷰 제외 경로 (노이즈 감소)                        #
  # -------------------------------------------------------------- #
  path_filters:
    - "!**/build/**"
    - "!**/*.lock"
    - "!gradle/wrapper/**"
    - "!infra/src/main/resources/data-*.sql"

  # -------------------------------------------------------------- #
  #                  경로별 리뷰 관점 지정                             #
  # -------------------------------------------------------------- #
  path_instructions:
    # --- 공통: 전체 Java 코드 기본 관점 ---
    - path: "**/*.java"
      instructions: >
        Spring Boot 컨벤션(계층 분리, 트랜잭션 경계, N+1 쿼리)을 중점적으로 봐주세요.

    # --- 계층별 관점 ---
    - path: "**/controller/**"
      instructions: >
        요청 검증(@Valid), 예외를 적절한 HTTP 상태 코드로 변환하는지,
        컨트롤러에 비즈니스 로직이 새고 있지는 않은지 확인해주세요.
    - path: "**/service/**"
      instructions: >
        @Transactional 경계가 적절한지(읽기 전용 여부, 트랜잭션 범위가
        너무 크거나 작지 않은지), 외부 API/IO 호출이 트랜잭션 안에 물려
        있어 커넥션을 오래 잡고 있지 않은지 확인해주세요.
    - path: "**/repository/**"
      instructions: >
        JPA 쿼리 성능(N+1, fetch join, 인덱스 활용)을 특히 확인해주세요.
    - path: "**/{entity,domain}/**"
      instructions: >
        연관관계 fetch 전략(기본 EAGER로 방치된 곳), 양방향 연관관계의
        무한 순환 위험(equals/hashCode/toString), 엔티티에 setter를
        열어둬서 불변성이 깨지는 곳을 확인해주세요.
    - path: "**/dto/**"
      instructions: >
        요청/응답 DTO가 엔티티를 직접 노출하지 않는지, null 가능 필드에
        대한 처리가 되어 있는지 확인해주세요.
    - path: "**/config/**"
      instructions: >
        빈 스코프, 보안 관련 설정(CORS, 인증/인가)이 운영 환경에서
        의도치 않게 완화되어 있지 않은지 확인해주세요.

    # --- 모듈별 관점 (core / module-api / module-batch / module-realtime) ---
    - path: "core/**"
      instructions: >
        여러 모듈이 공유하는 코드입니다. 이 변경이 module-api,
        module-batch, module-realtime의 기존 동작을 깨뜨리지 않는지,
        하위 호환성을 우선 확인해주세요.
    - path: "module-api/**"
      instructions: >
        외부에 노출되는 API 계층입니다. 인증/인가 누락, 입력 검증,
        민감 정보 응답 노출 여부를 중점적으로 봐주세요.
    - path: "module-batch/**"
      instructions: >
        배치 작업의 멱등성과 실패 시 재시도 안전성, 부분 실패 시
        롤백/재개 전략을 확인해주세요.
    - path: "module-realtime/**"
      instructions: >
        동시성 이슈(레이스 컨디션, 락 범위), 세션/커넥션 정리 누락으로
        인한 리소스 누수를 중점적으로 봐주세요.

    # --- 테스트 / DB ---
    - path: "**/src/test/**"
      instructions: >
        해피 패스만이 아니라 예외/경계값 케이스를 다루는지,
        검증(assert)이 실제 동작을 확인하는지 확인해주세요.
    - path: "infra/src/main/resources/**.sql"
      instructions: >
        마이그레이션 순서와 롤백 가능 여부, 대용량 테이블에 락을 오래
        거는 DDL이 없는지 확인해주세요.

  # -------------------------------------------------------------- #
  #                     정적 분석 도구 연동                            #
  # -------------------------------------------------------------- #
  tools:
    fbinfer:
      # Infer의 Java 분석은 기본으로 꺼져 있어 명시적으로 켭니다
      # (NPE, 리소스 누수, 동시성 버그 탐지)
      enable_java: true

# ================================================================ #
#                       코드 생성 설정                                #
# ================================================================ #
code_generation:
  docstrings:
    # 문서 주석 언어
    language: "ko-KR"
