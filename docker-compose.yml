services:
  # =========================
  # MySQL - rds
  # =========================

  mysql:
    image: mysql:8.4
    container_name: modoo_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: modoo_mysql
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./infra/src/main/resources/data-01-tags.sql:/docker-entrypoint-initdb.d/03-data-01-tags.sql:ro
      - ./infra/src/main/resources/data-02-contents.sql:/docker-entrypoint-initdb.d/04-data-02-contents.sql:ro
      - ./infra/src/main/resources/data-03-users.sql:/docker-entrypoint-initdb.d/05-data-03-users.sql:ro
      - ./infra/src/main/resources/data-04-reviews.sql:/docker-entrypoint-initdb.d/06-data-04-reviews.sql:ro
      - ./infra/src/main/resources/data-05-interactions.sql:/docker-entrypoint-initdb.d/07-data-05-interactions.sql:ro
      - ./infra/src/main/resources/data-06-playlists.sql:/docker-entrypoint-initdb.d/08-data-06-playlists.sql:ro
      - ./infra/src/main/resources/data-07-follows.sql:/docker-entrypoint-initdb.d/09-data-07-follows.sql:ro
      - ./infra/src/main/resources/data-08-watching-sessions.sql:/docker-entrypoint-initdb.d/10-data-08-watching-sessions.sql:ro
    restart: unless-stopped


  # =========================
  # Redis - 엘라스틱 캐시
  # =========================

  redis:
    image: redis/redis-stack-server
    container_name: modoo_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped


  # =========================
  # Kafka - ec2
  # =========================

  kafka:
    image: apache/kafka:latest
    container_name: modoo_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    restart: unless-stopped


  # =========================
  # Elasticsearch - ec2
  # =========================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    container_name: modoo_elasticsearch

    # Nori 한국어 형태소 분석기 설치 후 Elasticsearch 실행
    command:
      - bash
      - -c
      - |
        set -e
        if [ ! -d /usr/share/elasticsearch/plugins/analysis-nori ]; then
          bin/elasticsearch-plugin install --batch analysis-nori
        fi
        exec /usr/local/bin/docker-entrypoint.sh

    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped


  # =========================
  # Kibana - ec2
  # =========================

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: media-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: unless-stopped


  # =========================
  # Logstash - ec2
  # =========================

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: media-logstash
    ports:
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      - elasticsearch
    restart: unless-stopped


  # =========================
  # Prometheus
  # =========================

  prometheus:
    image: prom/prometheus:latest
    container_name: media-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/src/main/resources/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped


  # =========================
  # Grafana
  # =========================

  grafana:
    image: grafana/grafana:latest
    container_name: media-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped


# =========================
# Volumes
# =========================

volumes:
  mysql-data:
  redis-data:
  elasticsearch-data:
  grafana-data:
  prometheus-data:
