# ================================
# Secrets (보안값, Environment secrets) — 3개 서비스 공용
# AWS_ACCOUNT_ID  : AWS 계정 ID
# AWS_ACCESS_KEY  : IAM Access Key ID
# AWS_SECRET_KEY  : IAM Secret Access Key
#
# Vars (일반 변수, Environment variables)
# AWS_REGION                    : 배포 리전 (ap-northeast-2)
# ECS_CLUSTER                    : modoo-cluster (3개 서비스 공용)
# ECR_REPOSITORY_API             : modoo-playlist/api
# ECS_TASK_DEFINITION_API        : modoo-api-task
# ECS_SERVICE_API                : modoo-api-service
# ECR_REPOSITORY_BATCH           : modoo-playlist/batch
# ECS_TASK_DEFINITION_BATCH      : modoo-batch-task
# ECS_SERVICE_BATCH              : modoo-batch-service
# ECR_REPOSITORY_REALTIME        : modoo-playlist/realtime
# ECS_TASK_DEFINITION_REALTIME   : modoo-realtime-task
# ECS_SERVICE_REALTIME           : modoo-realtime-service
# ================================

name: 배포

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ github.event_name == 'workflow_dispatch' && '["module-api","module-batch","module-realtime"]' || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            module-api:
              - 'core/**'
              - 'infra/**'
              - 'module-api/**'
              - 'Dockerfile'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
            module-batch:
              - 'core/**'
              - 'infra/**'
              - 'module-batch/**'
              - 'Dockerfile'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
            module-realtime:
              - 'core/**'
              - 'infra/**'
              - 'module-realtime/**'
              - 'Dockerfile'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'

  build-and-push:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.modules != '[]'
    strategy:
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v5

      - name: AWS CLI 설정
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker 이미지 빌드 및 푸시 (${{ matrix.module }})
        run: |
          case "${{ matrix.module }}" in
            module-api)      ECR_REPO="${{ vars.ECR_REPOSITORY_API }}" ;;
            module-batch)    ECR_REPO="${{ vars.ECR_REPOSITORY_BATCH }}" ;;
            module-realtime) ECR_REPO="${{ vars.ECR_REPOSITORY_REALTIME }}" ;;
          esac
          ECR_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/$ECR_REPO"

          docker buildx build \
            --build-arg MODULE=${{ matrix.module }} \
            --cache-from "type=gha,scope=${{ matrix.module }}" \
            --cache-to "type=gha,mode=max,scope=${{ matrix.module }}" \
            -t "$ECR_URI:${{ github.sha }}" \
            -t "$ECR_URI:latest" \
            --push \
            .

  deploy:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]
    if: needs.detect-changes.outputs.modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: AWS CLI 설정
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ECS 태스크 정의 업데이트 (${{ matrix.module }})
        run: |
          case "${{ matrix.module }}" in
            module-api)      ECR_REPO="${{ vars.ECR_REPOSITORY_API }}";      TASK_DEF="${{ vars.ECS_TASK_DEFINITION_API }}" ;;
            module-batch)    ECR_REPO="${{ vars.ECR_REPOSITORY_BATCH }}";    TASK_DEF="${{ vars.ECS_TASK_DEFINITION_BATCH }}" ;;
            module-realtime) ECR_REPO="${{ vars.ECR_REPOSITORY_REALTIME }}"; TASK_DEF="${{ vars.ECS_TASK_DEFINITION_REALTIME }}" ;;
          esac
          ECR_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/$ECR_REPO"

          TASK_DEFINITION=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF")

          NEW_TASK_DEFINITION=$(echo "$TASK_DEFINITION" | jq \
            --arg IMAGE "$ECR_URI:${{ github.sha }}" \
            '.taskDefinition
            | .containerDefinitions[0].image = $IMAGE
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )')

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEFINITION" | jq -r '.taskDefinition.taskDefinitionArn')

          echo "NEW_TASK_DEF_ARN=$NEW_TASK_DEF_ARN" >> "$GITHUB_ENV"

      - name: ECS 서비스 업데이트 및 안정화 대기 (${{ matrix.module }})
        run: |
          case "${{ matrix.module }}" in
            module-api)      SERVICE="${{ vars.ECS_SERVICE_API }}";      DESIRED_COUNT=2 ;;
            module-batch)    SERVICE="${{ vars.ECS_SERVICE_BATCH }}";    DESIRED_COUNT=1 ;;
            module-realtime) SERVICE="${{ vars.ECS_SERVICE_REALTIME }}"; DESIRED_COUNT=1 ;;
          esac

          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "$SERVICE" \
            --task-definition "$NEW_TASK_DEF_ARN" \
            --desired-count "$DESIRED_COUNT" \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "$SERVICE"
